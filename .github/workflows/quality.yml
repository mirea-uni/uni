name: Code quality

on:
  push:
    branches: [main, test]
  pull_request:
    branches: [main, test]
  merge_group:
    branches: [main, test]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ruff lint
            command: uv run ruff check .
          - name: Ruff format
            command: uv run ruff format --check .
          - name: Mypy
            command: uv run mypy
    env:
      UV_LOCKED: "true"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.7"
          enable-cache: true

      - name: Install Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --locked --dev

      - name: Run ${{ matrix.name }}
        run: ${{ matrix.command }}
